<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Espaces Tech Daïra</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
    }
    h1 {
      font-size: 28px;
      margin: 10px 0;
    }
    p {
      font-size: 18px;
      opacity: 0.8;
    }
    .logo {
      font-size: 64px;
    }
    .clignote {
      color: #e53935;
      animation: blink 1s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }
  </style>
</head>
<body>
  <div class="logo">💻</div>
  <h1><span class="clignote">Bienvenue</span> dans<br>Espaces Tech Daïra</h1>
  <p id="salut"></p>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe.user;
    if (user) {
      document.getElementById("salut").innerText = "Salut " + user.first_name + " 👋";
    }
  </script>
</body>
</html>
